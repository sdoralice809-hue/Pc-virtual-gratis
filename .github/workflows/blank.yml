name: PC Virtual

on:
  workflow_dispatch:
    inputs:
      access_password:
        description: "Senha do PC virtual"
        required: true
        default: "123456"

jobs:
  pc-virtual:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configurar senha
        run: |
          echo "runner:${{ github.event.inputs.access_password }}" | sudo chpasswd

      - name: Instalar XFCE e VNC
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-goodies tigervnc-standalone-server curl

      - name: Configurar VNC
        run: |
          mkdir -p ~/.vnc

          printf '%s\n' "${{ github.event.inputs.access_password }}" \
            | vncpasswd -f > ~/.vnc/passwd

          chmod 600 ~/.vnc/passwd

          cat > ~/.vnc/xstartup <<'EOF'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          startxfce4 &
          EOF

          chmod +x ~/.vnc/xstartup

      - name: Instalar Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null

          echo "deb https://ngrok-agent.s3.amazonaws.com bookworm main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list

          sudo apt-get update
          sudo apt-get install -y ngrok

      - name: Configurar Ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          ngrok config add-authtoken "$NGROK_AUTHTOKEN"

      - name: Iniciar VNC
        run: |
          vncserver :1 -geometry 1280x720 -depth 24
          sleep 3

      - name: Criar túnel
        run: |
          nohup ngrok tcp 5901 > /tmp/ngrok.log 2>&1 &
          sleep 8

          echo "===== ENDEREÇO DO PC VIRTUAL ====="
          curl -s http://127.0.0.1:4040/api/tunnels
          echo ""
          echo "==================================="

      - name: Manter PC online
        run: |
          echo "PC Virtual Online"
          sleep 21000
